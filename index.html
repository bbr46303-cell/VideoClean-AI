<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VideoClean AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}.container{width:min(900px,92%);margin:auto}header{padding:20px 0;border-bottom:1px solid #222}.logo{font-size:32px;font-weight:900;background:linear-gradient(90deg,#08d8ff,#596cff,#9b3cff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero{text-align:center;padding:55px 0 30px}.hero h1{font-size:clamp(42px,8vw,75px);margin:0 0 18px}.gradient{background:linear-gradient(90deg,#00d9ff,#6174ff,#9b39ff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#ccc;font-size:19px;line-height:1.5}.card{background:#121212;border:1px solid #292929;border-radius:25px;padding:28px;box-shadow:0 15px 50px rgba(0,0,0,.3)}.field{width:100%;padding:17px;margin:8px 0;border-radius:14px;border:1px solid #333;background:#080808;color:#fff;font-size:17px;outline:none}.field:focus{border-color:#20d9ff}.primary{width:100%;padding:17px;border:0;border-radius:30px;background:linear-gradient(90deg,#08d7f3,#447cff,#873eff);color:#fff;font-size:18px;font-weight:900;cursor:pointer;margin-top:10px}.primary:disabled{opacity:.55}.secondary{width:100%;padding:15px;border:1px solid #333;border-radius:14px;background:#191919;color:#fff;font-size:16px;cursor:pointer;margin-top:10px}.secondary:disabled{opacity:.55}.msg{text-align:center;min-height:25px;margin-top:15px;color:#aaa;line-height:1.5}#appBox{display:none}.drop{display:block;padding:45px 20px;margin-top:20px;text-align:center;border:2px dashed #444;border-radius:22px;cursor:pointer;background:#0d0d0d}.drop:hover{border-color:#20d9ff}input[type=file]{display:none}.file-name{margin-top:15px;color:#aaa;word-break:break-word}#previewWrap{display:none;margin-top:20px}video{width:100%;max-height:520px;border-radius:15px;background:#000;display:block}.status{text-align:center;margin-top:20px;color:#20d9ff;min-height:28px;line-height:1.5}.payment-box{margin-top:22px;padding:20px;border:1px solid #292929;border-radius:18px;background:#0c0c0c}.payment-title{font-size:20px;font-weight:900}.payment-price{font-size:30px;font-weight:900;margin:12px 0;background:linear-gradient(90deg,#08d7f3,#873eff);-webkit-background-clip:text;background-clip:text;color:transparent}.small{color:#999;font-size:14px;line-height:1.5}.download{display:block;width:100%;padding:16px;margin-top:15px;border-radius:14px;background:linear-gradient(90deg,#08d7f3,#447cff,#873eff);color:#fff;text-decoration:none;font-weight:900;text-align:center}.logout{margin-top:15px;background:#222}footer{text-align:center;color:#777;padding:50px 0}
</style>
</head>
<body>
<header><div class="container"><div class="logo">VideoClean AI</div></div></header>
<main>
<section class="hero container"><h1>Video<span class="gradient">Clean</span> AI</h1><p>Professional Video Cleanup • Enhancement • Audio Cleanup</p></section>
<section class="container"><div class="card">
<div id="authBox">
<h2 style="text-align:center">Login / Create Account</h2>
<input class="field" id="email" type="email" placeholder="Email address" autocomplete="email">
<input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password">
<button class="primary" id="authButton" type="button" onclick="handleAuth()">Login</button>
<button class="secondary" id="switchButton" type="button" onclick="toggleAuth()">Create new account</button>
<div class="msg" id="authMessage"></div>
</div>
<div id="appBox">
<h2>Welcome to VideoClean AI 👋</h2><p id="userEmail" style="color:#aaa"></p><hr><h2>Video Cleaner</h2>
<label class="drop" for="videoFile"><div style="font-size:45px">📤</div><strong style="font-size:21px">Upload Video</strong><div style="color:#777;margin-top:8px">Tap here to select your video</div><div class="file-name" id="fileName">No file selected</div></label>
<input id="videoFile" type="file" accept="video/*" onchange="showVideo()">
<div id="previewWrap"><video id="videoPreview" controls playsinline></video></div>
<div class="payment-box"><div class="payment-title">💳 Payment</div><div class="small">Payment is required before video processing.</div><div class="payment-price">₹99</div><div class="small">One video processing payment.</div><button class="primary" id="payButton" type="button" onclick="startPayment()">💳 Pay ₹99 &amp; Process Video</button><div class="msg" id="paymentMessage"></div></div>
<div class="status" id="status"></div>
<button class="secondary logout" type="button" onclick="logout()">Logout</button>
</div>
</div></section>
</main>
<footer>© 2026 VideoClean AI — All rights reserved.</footer>
<script>
const SUPABASE_URL="https://imqkvnfmampzxpvkchtp.supabase.co";
const SUPABASE_KEY="sb_publishable_5-t8gpTfjxFZSSAnDcSjVQ_LtgZfCRf";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const PAYMENT_AMOUNT_PAISE=4900;
let signupMode=false,processing=false;
function toggleAuth(){signupMode=!signupMode;document.getElementById("authButton").innerText=signupMode?"Sign Up":"Login";document.getElementById("switchButton").innerText=signupMode?"Back to Login":"Create new account";document.getElementById("authMessage").innerText=""}
async function handleAuth(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,message=document.getElementById("authMessage"),button=document.getElementById("authButton");if(!email){message.innerText="Please enter your email.";return}if(!password){message.innerText="Please enter your password.";return}if(password.length<6){message.innerText="Password must be at least 6 characters.";return}button.disabled=true;message.innerText=signupMode?"Creating account...":"Logging in...";try{if(signupMode){const {data,error}=await supabaseClient.auth.signUp({email,password});if(error)throw error;if(data.session)showApp(data.user);else{message.innerText="Account created successfully. Confirm your email if required, then login.";signupMode=false;document.getElementById("authButton").innerText="Login";document.getElementById("switchButton").innerText="Create new account"}}else{const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;if(data.user)showApp(data.user)}}catch(e){console.error(e);message.innerText=e.message||"Login failed."}button.disabled=false}
function showApp(user){document.getElementById("authBox").style.display="none";document.getElementById("appBox").style.display="block";document.getElementById("userEmail").innerText="Logged in as: "+(user.email||"")}
async function checkUser(){try{const {data,error}=await supabaseClient.auth.getUser();if(error){console.log(error);return}if(data.user)showApp(data.user)}catch(e){console.error(e)}}
async function logout(){try{await supabaseClient.auth.signOut()}catch(e){console.error(e)}document.getElementById("appBox").style.display="none";document.getElementById("authBox").style.display="block";document.getElementById("authMessage").innerText="Logged out successfully."}
function showVideo(){const input=document.getElementById("videoFile"),file=input.files[0];if(!file)return;const video=document.getElementById("videoPreview");if(video.src)URL.revokeObjectURL(video.src);document.getElementById("fileName").innerText=file.name;video.src=URL.createObjectURL(file);document.getElementById("previewWrap").style.display="block";document.getElementById("status").innerText="";document.getElementById("paymentMessage").innerText="";removeDownloadButton()}
function removeDownloadButton(){const old=document.getElementById("downloadButton");if(old)old.remove()}
async function createOrder(){const r=await fetch("/api/create-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount:PAYMENT_AMOUNT_PAISE,currency:"INR"})});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.detail||d.error||"Unable to create payment order.");if(!d.order_id)throw new Error("Razorpay order ID not received.");return d}
async function verifyPayment(p){const r=await fetch("/api/verify-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({razorpay_payment_id:p.razorpay_payment_id,razorpay_order_id:p.razorpay_order_id,razorpay_signature:p.razorpay_signature})});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.detail||d.error||"Payment verification failed.");return d}
async function startPayment(){if(processing)return;const file=document.getElementById("videoFile").files[0],pm=document.getElementById("paymentMessage"),status=document.getElementById("status"),pay=document.getElementById("payButton");if(!file){status.innerText="❌ Please select a video first.";return}if(!window.Razorpay){pm.innerText="❌ Razorpay checkout could not load. Refresh the page.";return}processing=true;pay.disabled=true;pm.innerText="⏳ Creating secure payment order...";status.innerText="";try{const order=await createOrder();const cr=await fetch("/api/razorpay-config");const config=await cr.json();if(!cr.ok||!config.key_id)throw new Error(config.detail||"Razorpay Key ID is not configured.");const options={key:config.key_id,amount:order.amount,currency:order.currency,name:"VideoClean AI",description:"Video processing",order_id:order.order_id,prefill:{email:document.getElementById("email").value.trim()},theme:{color:"#447cff"},handler:async function(response){try{pm.innerText="⏳ Verifying payment...";const verified=await verifyPayment(response);if(!verified.success)throw new Error("Payment verification failed.");pm.innerText="✅ Payment verified.";await processVideo()}catch(e){console.error(e);pm.innerText="❌ "+(e.message||"Payment verification failed.");pay.disabled=false;processing=false}},modal:{ondismiss:function(){pm.innerText="Payment cancelled.";pay.disabled=false;processing=false}}};const rz=new Razorpay(options);rz.on("payment.failed",function(){pm.innerText="❌ Payment failed. Please try again.";pay.disabled=false;processing=false});rz.open()}catch(e){console.error(e);pm.innerText="❌ "+(e.message||"Payment failed.");pay.disabled=false;processing=false}}
async function processVideo(){const file=document.getElementById("videoFile").files[0],status=document.getElementById("status"),pay=document.getElementById("payButton");if(!file){status.innerText="❌ Please select a video first.";processing=false;pay.disabled=false;return}status.innerText="⏳ Uploading and processing video... Please wait.";removeDownloadButton();const fd=new FormData();fd.append("video",file);fd.append("x","0");fd.append("y","0");fd.append("w","0");fd.append("h","0");fd.append("enhance","true");fd.append("audio_clean","true");try{const r=await fetch("/process-video",{method:"POST",body:fd});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.detail||d.error||"Video processing failed.");if(!d.job)throw new Error("No job ID received from server.");status.innerText="✅ Video processed successfully!";const a=document.createElement("a");a.id="downloadButton";a.className="download";a.href="/download/"+encodeURIComponent(d.job);a.download="VideoClean_AI_output.mp4";a.innerText="⬇️ Download Clean Video";document.getElementById("appBox").appendChild(a)}catch(e){console.error(e);status.innerText="❌ "+(e.message||"Processing failed.")}finally{processing=false;pay.disabled=false}}
document.addEventListener("DOMContentLoaded",checkUser);
</script>
</body>
</html>
