<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VideoClean AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#050505;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}
.container{width:min(900px,92%);margin:auto}

header{
padding:20px 0;
border-bottom:1px solid #222;
}

.logo{
font-size:32px;
font-weight:900;
background:linear-gradient(90deg,#08d8ff,#596cff,#9b3cff);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.hero{
text-align:center;
padding:65px 0 35px;
}

.hero h1{
font-size:clamp(42px,8vw,75px);
margin:0 0 20px;
}

.gradient{
background:linear-gradient(90deg,#00d9ff,#6174ff,#9b39ff);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.hero p{
color:#ccc;
font-size:19px;
}

.card{
background:#121212;
border:1px solid #292929;
border-radius:25px;
padding:28px;
box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.field{
width:100%;
padding:17px;
margin:8px 0;
border-radius:14px;
border:1px solid #333;
background:#080808;
color:#fff;
font-size:17px;
}

.primary{
width:100%;
padding:17px;
border:0;
border-radius:30px;
background:linear-gradient(90deg,#08d7f3,#447cff,#873eff);
color:#fff;
font-size:18px;
font-weight:900;
cursor:pointer;
margin-top:10px;
}

.secondary{
width:100%;
padding:15px;
border:1px solid #333;
border-radius:14px;
background:#191919;
color:#fff;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

.msg{
text-align:center;
min-height:25px;
margin-top:15px;
color:#aaa;
}

#appBox{
display:none;
}

.drop{
display:block;
padding:50px 20px;
margin-top:20px;
text-align:center;
border:2px dashed #444;
border-radius:22px;
cursor:pointer;
background:#0d0d0d;
}

.drop:hover{
border-color:#20d9ff;
}

input[type=file]{
display:none;
}

.file-name{
margin-top:15px;
color:#aaa;
word-break:break-word;
}

#previewWrap{
display:none;
margin-top:20px;
}

video{
width:100%;
border-radius:15px;
background:#000;
}

.status{
text-align:center;
margin-top:20px;
color:#20d9ff;
}

.logout{
margin-top:15px;
background:#222;
}

footer{
text-align:center;
color:#777;
padding:50px 0;
}
</style>
</head>

<body>

<header>
<div class="container">
<div class="logo">VideoClean AI</div>
</div>
</header>

<main>

<section class="hero container">

<h1>
Video<span class="gradient">Clean</span> AI
</h1>

<p>
Professional Video Cleanup • Enhancement • Audio Cleanup
</p>

</section>


<section class="container">

<div class="card">

<!-- LOGIN -->

<div id="authBox">

<h2 style="text-align:center">
Login / Create Account
</h2>

<input
class="field"
id="email"
type="email"
placeholder="Email address"
autocomplete="email"
>

<input
class="field"
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button
class="primary"
id="authButton"
type="button"
onclick="handleAuth()"
>
Login
</button>

<button
class="secondary"
id="switchButton"
type="button"
onclick="toggleAuth()"
>
Create new account
</button>

<div
class="msg"
id="authMessage"
></div>

</div>


<!-- APP -->

<div id="appBox">

<h2>
Welcome to VideoClean AI 👋
</h2>

<p id="userEmail" style="color:#aaa"></p>

<hr>

<h2>Video Cleaner</h2>

<label class="drop" for="videoFile">

<div style="font-size:45px">📤</div>

<strong style="font-size:21px">
Upload Video
</strong>

<div style="color:#777;margin-top:8px">
Tap here to select your video
</div>

<div class="file-name" id="fileName">
No file selected
</div>

</label>

<input
id="videoFile"
type="file"
accept="video/*"
onchange="showVideo()"
>

<div id="previewWrap">

<video
id="videoPreview"
controls
playsinline
></video>

</div>

<button
class="primary"
type="button"
onclick="processVideo()"
>
✨ Process Video
</button>

<div
class="status"
id="status"
></div>

<button
class="secondary logout"
type="button"
onclick="logout()"
>
Logout
</button>

</div>

</div>

</section>

</main>

<footer>
© 2026 VideoClean AI — All rights reserved.
</footer>


<script>

/* =========================
   SUPABASE CONNECTION
========================= */

const SUPABASE_URL =
"https://imqkvnfmampzxpvkchtp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5-t8gpTfjxFZSSAnDcSjVQ_LtgZfCRf";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   AUTH MODE
========================= */

let signupMode = false;


function toggleAuth(){

signupMode = !signupMode;

const button =
document.getElementById("authButton");

const switchButton =
document.getElementById("switchButton");

const message =
document.getElementById("authMessage");

if(signupMode){

button.innerText = "Sign Up";
switchButton.innerText = "Back to Login";

}else{

button.innerText = "Login";
switchButton.innerText = "Create new account";

}

message.innerText = "";

}


/* =========================
   LOGIN / SIGNUP
========================= */

async function handleAuth(){

const email =
document.getElementById("email")
.value
.trim();

const password =
document.getElementById("password")
.value;

const message =
document.getElementById("authMessage");

const button =
document.getElementById("authButton");


if(!email){

message.innerText =
"Please enter your email.";

return;

}

if(!password){

message.innerText =
"Please enter your password.";

return;

}

if(password.length < 6){

message.innerText =
"Password must be at least 6 characters.";

return;

}


button.disabled = true;

message.innerText =
signupMode
? "Creating account..."
: "Logging in...";


try{

if(signupMode){

const {data,error} =
await supabaseClient.auth.signUp({
email:email,
password:password
});

if(error){
throw error;
}

if(data.session){

showApp(data.user);

}else{

message.innerText =
"Account created successfully. Please login.";

signupMode = false;

document.getElementById(
"authButton"
).innerText = "Login";

document.getElementById(
"switchButton"
).innerText = "Create new account";

}

}else{

const {data,error} =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){
throw error;
}

if(data.user){

showApp(data.user);

}

}

}catch(error){

console.error(error);

message.innerText =
error.message || "Login failed.";

}

button.disabled = false;

}


/* =========================
   SHOW APP
========================= */

function showApp(user){

document.getElementById(
"authBox"
).style.display = "none";

document.getElementById(
"appBox"
).style.display = "block";

document.getElementById(
"userEmail"
).innerText =
"Logged in as: " + user.email;

}


/* =========================
   CHECK EXISTING LOGIN
========================= */

async function checkUser(){

try{

const {data,error} =
await supabaseClient.auth.getUser();

if(error){

console.log(error);

return;

}

if(data.user){

showApp(data.user);

}

}catch(error){

console.error(error);

}

}


/* =========================
   LOGOUT
========================= */

async function logout(){

await supabaseClient.auth.signOut();

document.getElementById(
"appBox"
).style.display = "none";

document.getElementById(
"authBox"
).style.display = "block";

document.getElementById(
"authMessage"
).innerText =
"Logged out successfully.";

}


/* =========================
   VIDEO PREVIEW
========================= */

function showVideo(){

const input =
document.getElementById("videoFile");

const file =
input.files[0];

if(!file){

return;

}

document.getElementById(
"fileName"
).innerText =
file.name;

const video =
document.getElementById(
"videoPreview"
);

const wrap =
document.getElementById(
"previewWrap"
);

video.src =
URL.createObjectURL(file);

wrap.style.display = "block";

}


/* =========================
   PROCESS
========================= */

function processVideo(){

const file =
document.getElementById(
"videoFile"
).files[0];

const status =
document.getElementById(
"status"
);

if(!file){

status.innerText =
"Please select a video first.";

return;

}

status.innerText =
"Video selected successfully. Processing backend will be connected next.";

}


/* =========================
   START
========================= */

document.addEventListener(
"DOMContentLoaded",
function(){

checkUser();

}
);

</script>

</body>
</html>
