<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoClean AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#071020;
  color:white;
}
.container{
  max-width:600px;
  margin:auto;
  padding:25px;
}
.card{
  background:#111a2e;
  padding:25px;
  border-radius:20px;
  margin-top:25px;
}
h1{
  font-size:40px;
}
.green{color:#52e0d0}
input,button{
  width:100%;
  box-sizing:border-box;
  padding:15px;
  margin:8px 0;
  border-radius:10px;
  border:0;
  font-size:16px;
}
input{
  background:#0b1325;
  color:white;
  border:1px solid #34405c;
}
button{
  background:#55dfd0;
  color:#071020;
  font-weight:bold;
  cursor:pointer;
}
.secondary{
  background:#273654;
  color:white;
}
.hidden{display:none}
.message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#18243b;
}
.logout{
  background:#d9534f;
  color:white;
}
</style>
</head>

<body>

<div class="container">

  <h1>Video<span class="green">Clean</span> AI</h1>
  <p>Logo removal • Enhancement • Audio cleanup</p>

  <!-- LOGIN / SIGNUP -->
  <div id="authBox" class="card">

    <h2 id="authTitle">Login</h2>

    <input id="email" type="email" placeholder="Email address">

    <input id="password" type="password" placeholder="Password">

    <button id="authButton" onclick="login()">Login</button>

    <button class="secondary" onclick="toggleAuth()">
      Create new account
    </button>

    <div id="authMessage" class="message hidden"></div>

  </div>


  <!-- VIDEO APP -->
  <div id="appBox" class="card hidden">

    <h2>Welcome to VideoClean AI 👋</h2>

    <p id="userEmail"></p>

    <button class="logout" onclick="logout()">Logout</button>

    <hr>

    <h3>Video Cleaner</h3>

    <input type="file" accept="video/*">

    <button onclick="processVideo()">✨ Process Video</button>

  </div>

</div>


<script>

const SUPABASE_URL = "https://imqkvnfmampzxpvkchtp.supabase.co";
const SUPABASE_KEY = "sb_publishable_5-t8gpTfjxFZSSAnDcSjVQ_LtgZfCRf";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let signupMode = false;


// Toggle Login / Signup
function toggleAuth(){

  signupMode = !signupMode;

  document.getElementById("authTitle").innerText =
    signupMode ? "Create Account" : "Login";

  document.getElementById("authButton").innerText =
    signupMode ? "Sign Up" : "Login";

  document.querySelector(".secondary").innerText =
    signupMode ? "Already have an account? Login" :
                 "Create new account";
}


// Login / Signup
async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const msg =
    document.getElementById("authMessage");

  if(!email || !password){

    msg.classList.remove("hidden");
    msg.innerText =
      "Please enter email and password.";

    return;
  }

  msg.classList.remove("hidden");
  msg.innerText = "Please wait...";


  if(signupMode){

    const {data,error} =
      await supabaseClient.auth.signUp({
        email:email,
        password:password
      });

    if(error){

      msg.innerText = error.message;
      return;

    }

    msg.innerText =
      "Account created! Check your email to confirm your account.";

  }else{

    const {data,error} =
      await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
      });

    if(error){

      msg.innerText = error.message;
      return;

    }

    showApp(data.user);
  }
}


// Show VideoClean App
function showApp(user){

  document.getElementById("authBox")
    .classList.add("hidden");

  document.getElementById("appBox")
    .classList.remove("hidden");

  document.getElementById("userEmail")
    .innerText = "Logged in as: " + user.email;
}


// Logout
async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById("appBox")
    .classList.add("hidden");

  document.getElementById("authBox")
    .classList.remove("hidden");
}


// Check existing session
async function checkUser(){

  const {data} =
    await supabaseClient.auth.getUser();

  if(data.user){

    showApp(data.user);

  }
}

checkUser();

</script>

</body>
</html>
